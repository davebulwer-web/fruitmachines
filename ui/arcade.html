<title>Fruit Machine Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  /* Layout: a neon sign over a row of machine cabinets standing on the arcade floor; picking one
     opens its screen, centred and scaled in whole pixels. One deliberate night-time look. */
  :root {
    --night: #0b0614; --ink: #f4ead8; --dim: #b8a8c8; --neon: #ff3fae; --neon-2: #3fd6ff; --gold: #ffc940;
    --cabinet: #1c1028; --cabinet-edge: #3a2450; --bezel: #07040c;
    --display: 'Press Start 2P', 'Courier New', monospace; --body: 'VT323', ui-monospace, 'Courier New', monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night); color: var(--ink); font: 22px/1.25 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box; overflow: hidden;
  }
  /* the arcade itself, behind everything, dimmed so the cabinets stand out */
  #backdrop {
    position: fixed; inset: 0; z-index: 0; background: var(--night) center / cover no-repeat;
    image-rendering: pixelated; filter: saturate(1.1) brightness(0.42);
  }
  #backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #0b0614cc 0%, #0b061455 35%, #0b0614ee 100%); }
  #lobby { position: relative; z-index: 1; height: 100%; overflow-y: auto; box-sizing: border-box; padding-block: 28px 32px; }
  .wrap { max-width: 820px; margin: 0 auto; display: grid; gap: 28px; }

  header { text-align: center; display: grid; gap: 14px; justify-items: center; }
  .sign {
    font: 26px/1.5 var(--display); color: #ffe6f6; letter-spacing: 2px; margin: 0; text-wrap: balance;
    padding: 14px 20px; border: 3px solid var(--neon); border-radius: 10px;
    text-shadow: 0 0 4px #fff, 0 0 10px var(--neon), 0 0 22px var(--neon);
    box-shadow: 0 0 10px var(--neon), inset 0 0 12px #ff3fae66; animation: hum 6s infinite;
  }
  .sign span { color: #e6fbff; text-shadow: 0 0 4px #fff, 0 0 10px var(--neon-2), 0 0 22px var(--neon-2); }
  .strap { font: 11px/1.6 var(--display); color: var(--gold); letter-spacing: 1px; margin: 0; text-shadow: 0 0 8px #ffc94066; }
  @keyframes hum { 0%, 92%, 100% { opacity: 1 } 93% { opacity: .55 } 94% { opacity: 1 } 96% { opacity: .7 } }

  ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 28px; justify-items: center; }
  li { width: 100%; max-width: 280px; min-width: 0; }

  /* each machine is a cabinet: lit marquee, screen in a bezel, plinth with the coin slot */
  .cabinet {
    --accent: var(--neon); width: 100%; display: grid; gap: 0; padding: 0; cursor: pointer; text-align: center; color: var(--ink);
    background: var(--cabinet); border: 3px solid var(--cabinet-edge); border-radius: 14px 14px 6px 6px; font: inherit;
    box-shadow: 0 10px 0 #05020a, 0 0 0 1px #000; transition: transform .15s ease, box-shadow .15s ease;
  }
  .cabinet:hover, .cabinet:focus-visible { transform: translateY(-4px); box-shadow: 0 14px 0 #05020a, 0 0 22px var(--accent); outline: none; }
  .cabinet:focus-visible { border-color: var(--accent); }
  .marquee {
    font: 13px/1.4 var(--display); padding: 12px 8px; border-radius: 10px 10px 0 0; color: #fff;
    background: linear-gradient(180deg, #ffffff22, #00000033), var(--accent);
    text-shadow: 2px 2px 0 #00000088; letter-spacing: 1px;
  }
  .screen { background: var(--bezel); padding: 10px; border-block: 3px solid #000; }
  .screen img { display: block; width: 100%; max-width: 100%; aspect-ratio: 270 / 480; image-rendering: pixelated; border-radius: 4px; box-shadow: 0 0 0 2px #000, 0 0 16px #00000099; }
  .plinth { display: grid; gap: 8px; padding: 12px 14px 16px; }
  .tag { font-size: 20px; color: var(--ink); text-wrap: balance; }
  .meta { font-size: 18px; color: var(--dim); letter-spacing: .5px; }
  .play {
    justify-self: center; display: inline-flex; align-items: center; gap: 10px; margin-top: 4px;
    font: 11px/1 var(--display); color: #101010; background: var(--gold); padding: 10px 14px; border-radius: 4px;
    box-shadow: 0 3px 0 #8a6010;
  }
  .play::before { content: ""; width: 4px; height: 14px; background: #101010; border-radius: 2px; } /* the coin slot */
  .cabinet:hover .play { background: #fff0b0; }

  .soon { opacity: .55; cursor: default; filter: grayscale(.6); }
  .soon:hover { transform: none; box-shadow: 0 10px 0 #05020a, 0 0 0 1px #000; }
  .soon .screen > div { aspect-ratio: 270 / 480; display: grid; place-items: center; border: 2px dashed var(--cabinet-edge); border-radius: 4px; font: 10px/1.8 var(--display); color: var(--dim); }

  /* the way through to Pixel Pinball, when the two projects are built side by side */
  .pinball {
    display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; text-decoration: none; color: var(--ink);
    background: var(--cabinet); border: 3px solid var(--cabinet-edge); border-radius: 14px; padding: 14px; max-width: 560px; justify-self: center;
    box-shadow: 0 10px 0 #05020a, 0 0 0 1px #000; transition: transform .15s ease, box-shadow .15s ease;
  }
  .pinball:hover, .pinball:focus-visible { transform: translateY(-4px); box-shadow: 0 14px 0 #05020a, 0 0 22px var(--neon-2); outline: none; border-color: var(--neon-2); }
  .pinball img { width: 96px; aspect-ratio: 320 / 560; image-rendering: pixelated; border-radius: 4px; box-shadow: 0 0 0 2px #000; }
  .pb-text { display: grid; gap: 10px; justify-items: start; text-align: left; }
  .pb-sign { font: 16px/1.4 var(--display); color: #ffe6f6; text-shadow: 0 0 4px #fff, 0 0 10px var(--neon); }
  .pb-sign span { color: #e6fbff; text-shadow: 0 0 4px #fff, 0 0 10px var(--neon-2); }
  .pinball .play { justify-self: start; }
  .note { text-align: center; color: var(--dim); font-size: 19px; margin: 0; }
  .note b { font-weight: normal; color: var(--gold); }

  #stage { position: relative; z-index: 1; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; outline: none; }
  #back {
    position: fixed; z-index: 2; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px));
    background: var(--cabinet); color: var(--dim); border: 2px solid var(--cabinet-edge); border-radius: 4px; padding: 6px 10px;
    font: 9px/1 var(--display); cursor: pointer;
  }
  #back:hover, #back:focus-visible { color: var(--gold); border-color: var(--gold); outline: none; }
  @media (max-width: 520px) {
    body { font-size: 20px; }
    .sign { font-size: 17px; padding: 10px 12px; }
    ul { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .marquee { font-size: 10px; padding: 10px 4px; }
    .tag { font-size: 17px; } .meta { font-size: 16px; }
    .play { font-size: 9px; padding: 8px 10px; }
  }
  @media (prefers-reduced-motion: reduce) { .sign { animation: none; } .cabinet { transition: none; } }
  [hidden] { display: none !important; }
</style>
<div id="backdrop"></div>
<main id="lobby">
  <div class="wrap">
    <header>
      <h1 class="sign">FRUIT MACHINE <span>ARCADE</span></h1>
      <p class="strap">10P A GO &middot; PLAY MONEY ONLY</p>
    </header>
    <ul id="machines" aria-label="Machines"></ul>
    <a id="pinball" class="pinball" hidden>
      <span class="pb-text"><span class="pb-sign">PIXEL <span>PINBALL</span></span><span class="tag">Next door: pinball tables, 1 to 4 players.</span><span class="play">PLAY PINBALL</span></span>
    </a>
    <p class="note"><b>SPACE</b> start &nbsp; <b>1-3</b> hold or nudge &nbsp; <b>C</b> collect or take &nbsp; <b>G</b> gamble or roll &nbsp; <b>M</b> mute &nbsp; <b>ESC</b> back here</p>
  </div>
</main>
<button id="back" hidden>&larr; ARCADE</button>
<div id="stage" hidden><canvas id="screen" width="270" height="480" tabindex="0"></canvas></div>
<!--ART-->
<!--SCRIPT-->
